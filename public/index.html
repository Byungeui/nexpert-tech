<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NEXPERT TechDesk — 기술 지원 Q&A</title>

<!-- 파비콘·로고는 홈페이지(04_홈페이지/site)와 같은 마크를 인라인 SVG 로 쓴다.
     PNG 를 복사해 오면 CI 가 바뀔 때 두 곳을 고쳐야 하고, 한쪽을 빼먹는다.
     원본은 CI/build_ci.js 안의 SVG 다. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 3 42.2 13.5v21L24 45 5.8 34.5v-21L24 3z' fill='%230a1424' stroke='%233b8cff' stroke-width='3'/%3E%3Cpath d='M17 31.5v-15M17 16.5l14 15M31 31.5v-15' stroke='%2338d9f0' stroke-width='3.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg class="mark" width="34" height="34" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M24 3 42.2 13.5v21L24 45 5.8 34.5v-21L24 3z" fill="rgba(59,140,255,0.1)" stroke="#3b8cff" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M17 31.5v-15M17 16.5l14 15M31 31.5v-15" stroke="#38d9f0" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="17" cy="16.5" r="2.5" fill="#3b8cff"/>
        <circle cx="31" cy="31.5" r="2.5" fill="#3b8cff"/>
      </svg>
      <span class="word"><b>NEXPERT</b> TechDesk</span>
    </div>

    <!-- 카테고리는 서버(/api/categories)가 주는 목록으로 그린다 -->
    <nav class="tabs" id="tabs" aria-label="카테고리"></nav>
  </div>
</header>

<!-- 한 열이다. 옆에 열을 붙여 봤지만, 채팅은 세로로 읽는 화면이라
     그 열이 대화 내내 비어 있고 입력창만 한쪽으로 치우친다. -->
<main>
  <div id="log" class="log" aria-live="polite"></div>
  <div class="examples" id="examples"></div>

  <form id="form" class="composer">
    <!-- ⚠ 이 두 버튼은 처음에 **헤더 오른쪽 위**에 있었다. 눈도 손도 입력창 근처에
         있는데(같은 이유로 대화 시작 전 배치를 아래로 붙여 뒀다 — style.css 의
         body:not(.started) 주석) 반대편 구석까지 가야 해서 불편했다.
         입력줄 안에 두면 대화하다 그 자리에서 손이 닿는다.
         ⚠ 좁은 화면에서는 CSS 가 글자를 감추고 아이콘만 남긴다. 글자를 남기면
           입력칸이 눌려 정작 질문을 못 쓴다. -->
    <button id="newchat" type="button" class="tool-btn" title="새 대화">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      <span>새 대화</span>
    </button>
    <button id="openchats" type="button" class="tool-btn" title="저장된 대화" aria-haspopup="dialog">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h6"/></svg>
      <span>대화 <b id="chatcount">0</b></span>
    </button>

    <!-- ⚠ 조작법(Enter 전송 …)을 이 placeholder 에 넣지 마라. 한 줄짜리 입력창
         안에서 두 줄로 접혀 아래가 잘린다 — 휴대폰에서 실제로 그랬다.
         조작법은 아래 .keyhint 로 옮겼고, 좁은 화면에서는 CSS 가 감춘다. -->
    <textarea id="q" rows="1" placeholder="질문을 입력하세요" maxlength="2000"></textarea>
    <button id="send" type="submit">전송</button>
  </form>
  <p class="disclaimer">답변은 참고용입니다. 고객에게 전달하기 전에 벤더 공식 자료로 확인하세요.<span class="keyhint"> · Enter 전송, Shift+Enter 줄바꿈</span></p>
</main>

<!-- 저장된 대화 서랍. 기본은 닫혀 있다. -->
<div id="drawer" class="drawer" hidden>
  <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="저장된 대화">
    <header>
      <h2>저장된 대화</h2>
      <button id="closechats" type="button" aria-label="닫기">×</button>
    </header>
    <p class="drawer-note" id="drawernote"></p>
    <ul id="chatlist" class="chatlist"></ul>
    <footer>
      <span id="drawertotal"></span>
      <button id="clearall" type="button" class="linkdanger">전체 삭제</button>
    </footer>
  </div>
</div>

<!-- ⚠ store.js 가 먼저다. app.js 가 로드 시점에 window.Store 를 쓴다. -->
<script src="/store.js"></script>
<script src="/app.js"></script>
</body>
</html>
