<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NEXPERT Tech — 보안장비 기술 Q&A</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <div class="brand">
    <strong>NEXPERT</strong> <span>Tech</span>
  </div>
  <p class="sub">방화벽 · IPS · 네트워크 보안 기술 Q&amp;A</p>
</header>

<main>
  <div id="log" class="log">
    <div class="msg bot">
      <div class="body">
        <p>보안장비와 네트워크 기술에 대해 물어보세요.</p>
        <ul class="scope">
          <li><b>SECUI BLUEMAX NGF</b> — 검증된 제품 자료로 답합니다</li>
          <li><b>기술 개념·프로토콜</b> — 일반 기술 지식으로 답합니다</li>
          <li><b>타사 장비 모델별 수치</b> — 확인된 자료가 없어 답하지 않고, 비교 항목만 정리해 드립니다</li>
        </ul>
        <p class="note">최신 CVE·펌웨어 공지처럼 최근 정보는 조회할 수 없습니다. 회사 내부 정보는 다루지 않습니다.</p>
      </div>
    </div>
  </div>

  <div class="examples" id="examples">
    <button>방화벽과 IPS는 뭐가 다른가요?</button>
    <button>BLUEMAX NGF 1300 사양 알려줘</button>
    <button>SSL 인스펙션은 어떻게 동작하나요?</button>
    <button>방화벽 도입할 때 비교할 항목 정리해줘</button>
  </div>

  <form id="form" class="composer">
    <textarea id="q" rows="1" placeholder="질문을 입력하세요  (Enter 전송 · Shift+Enter 줄바꿈)" maxlength="2000"></textarea>
    <button id="send" type="submit">전송</button>
  </form>
  <p class="disclaimer">답변은 참고용입니다. 고객에게 전달하기 전에 벤더 공식 자료로 확인하세요.</p>
</main>

<script src="/app.js"></script>
</body>
</html>
